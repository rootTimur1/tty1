name: Build Debian Package

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # ручной запуск

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie  # или debian:stable для Debian 13[citation:7]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install build dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          devscripts \
          debhelper \
          dpkg-dev \
          fakeroot \
          lintian
        # Установка зависимостей сборки из debian/control
        mk-build-deps --install --tool 'apt-get -y' debian/control
    
    - name: Build Debian package
      run: |
        # Получение версии из changelog
        VERSION=$(dpkg-parsechangelog --show-field Version)
        echo "Building version: $VERSION"
        
        # Сборка пакета
        dpkg-buildpackage -us -uc -b --no-sign
        
        # Создание директории для артефактов
        mkdir -p artifacts
    
    - name: Collect artifacts
      run: |
        # Копирование всех .deb файлов в директорию artifacts
        cp ../*.deb artifacts/ 2>/dev/null || true
        cp ../*.buildinfo artifacts/ 2>/dev/null || true
        cp ../*.changes artifacts/ 2>/dev/null || true
        ls -la artifacts/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debian-packages
        path: artifacts/
        compression-level: 9
